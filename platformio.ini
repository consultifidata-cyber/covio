; PlatformIO project configuration file
;
; ADR-013 (Single Source of Truth, Native Test Harness, Pinned Toolchain):
; the root-level flat layout is this project's single source of truth for
; firmware sources. There is deliberately no `src/` folder -- src_dir below
; points PlatformIO at the project root instead of maintaining a second
; copy of every header, per ADR-013's Architecture Decision.
[platformio]
src_dir = .

; ---- RE-5 (Firmware Build Automation) -------------------------------------
; Shared base settings every environment below inherits -- avoids
; triplicating platform/board/framework/partition config across three
; environments, and specifically means the platform VERSION PIN exists in
; exactly ONE place, so the three build variants can never silently drift
; apart from each other (ADR-013's own "pinned toolchain" requirement,
; extended here from "one pin" to "one pin, inherited consistently").
;
; Pin, stated honestly: `espressif32@6.5.0` is a reasoned, deliberate choice
; (a long-stable PlatformIO platform release bundling arduino-esp32 core
; ~2.0.14 -- a mature, widely-used 2.x-generation core compatible with every
; API this firmware actually uses: WiFiClientSecure, ESPmDNS, Preferences,
; esp_ota_ops.h, WebServer, DNSServer, HTTPUpdate). It is NOT yet
; compiler-verified against this exact codebase -- no compiler has been
; available in any environment this project was developed in (VERSIONS.md).
; RE-5's own CI job (.github/workflows/ci.yml, `firmware` job) performs the
; first real compile against this pin. If it fails, the fix is a one-line
; version bump here, not a workflow redesign -- see
; Docs/FIRMWARE_BUILD.md for the full reasoning and update procedure.
[env]
platform = espressif32@6.5.0
; HARDWARE OVERRIDE (bench unit on hand): esptool identified the connected
; chip as a genuine ESP32-S3 (QFN56, 8MB embedded octal PSRAM, 16MB quad
; flash, native USB-Serial/JTAG) -- NOT the classic ESP32 this project was
; otherwise entirely written/pinned against (VERSIONS.md/SETUP.md/README.md
; all say "esp32dev is the only target"). board/memory_type/flash_size below
; are overridden for this specific unit; env name kept as `esp32dev` to
; avoid a repo-wide rename across CI/docs for a one-board bench flash.
board = esp32-s3-devkitc-1
; PSRAM dropped entirely: this firmware never allocates from it, and guessing
; the wrong psram type (quad vs octal) on an unbranded/clone module is a real
; bootloop cause -- not worth the risk for a feature nothing here uses.
;
; NOTE on key names: `board_build.flash_freq`/`board_build.flash_size` (tried
; first) are NOT real override keys for this platform -- they were silently
; ignored (esptool image_info on the actual flashed bootloader still showed
; Flash freq: 80m / Flash size: 8MB after "setting" both). The board JSON's
; real paths are build.f_flash (Hz string) and upload.flash_size, so the
; matching PlatformIO override keys are board_build.f_flash / board_upload.flash_size
; -- confirmed this time by re-reading the flashed image header, not assumed.
;
; QIO 40MHz isn't buildable at all -- the framework only ships 4 prebuilt
; bootloader ELFs for esp32s3: qio_80m, dio_80m, opi_80m, qio_120m. QIO@80m
; (the board default) bootlooped on this actual unit (confirmed via
; espefuse: secure boot/flash encryption both off, so not that -- and
; image_info confirmed the QIO@80m image itself was well-formed, so it's a
; genuine boot-time flash-access problem, not a build misconfiguration).
; Trying DIO@80m next: fewer signal lines toggling in parallel than QIO, a
; commonly more tolerant mode for flash chips/boards with marginal wiring.
board_build.flash_mode = dio
board_upload.flash_size = 16MB
framework = arduino
; Without this, Arduino's `Serial` binds to UART0 (GPIO43/44), which this
; native-USB board doesn't expose -- every Serial.print/println in this
; firmware (the boot banner, provisioning console, all [OK]/[FATAL]/[TOT]/
; [Q]/[NET] logging) would silently go nowhere. Confirmed on this unit with
; a bare blink-style test sketch: identical symptom (zero app output, only
; ESP-IDF's own separate system-log noise on the USB console) until this
; flag was added, after which the sketch's own prints appeared immediately.
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
; OTA requires two app partition slots. min_spiffs.csv (sized for 4MB flash)
; swapped for default_16MB.csv to actually use this unit's 16MB flash --
; also gives the new LittleFS queue partition (spiffs slot, ~3.4MB) far more
; offline-buffering headroom than the stock 128KB min_spiffs.csv would.
board_build.partitions = default_16MB.csv
monitor_speed = 115200
upload_port = COM6
monitor_port = COM6
; Build-identity remediation: injects BUILD_COMMIT/BUILD_DIRTY/
; BUILD_TIME_UTC fresh from git before every compile (all three
; environments below inherit this). Fails the build closed for
; [env:release] specifically if git identity can't be resolved, is
; malformed, or the tree is dirty -- see scripts/build_identity.py for the
; actual (host-testable) decision logic and
; test/native/test_build_identity.py for its tests.
extra_scripts = pre:scripts/generate_build_identity_extra.py
; Only the firmware's own .ino/.h sources belong in this build. Everything
; else at the project root (server/, Docs/, test/, .claude/) is non-C/C++
; and irrelevant to it -- excluded explicitly rather than relying solely on
; PlatformIO's default filter.
; NOTE: originally written as `src_filter` -- PlatformIO 6.1.15's LDF
; deprecated that key in favor of `build_src_filter` (silently produced
; "Nothing to build" instead of erroring, discovered on this project's own
; first-ever real compile; see SETUP.md's disclosed toolchain-untested gap).
; -<images/> added after `images/Arduino/` (Waveshare's own demo package,
; dropped in for reference/schematic lookup only) started getting swept into
; this build and failing to compile against this project's own libraries.
build_src_filter = +<*> -<server/> -<Docs/> -<test/> -<.claude/> -<tools/> -<images/>

; ---- Bench/dev build (unchanged name/behavior) -----------------------------
; RELEASE_BUILD=0, FACTORY_TEST_BUILD=0 -- config.h's own defaults, no
; override needed. This is the environment every DM-Phase in this project
; was implemented and reviewed against.
[env:esp32dev]

; ---- Production build (DM-Phase 5 / ADR-005) -------------------------------
; RELEASE_BUILD=1 (config.h): refuses to boot with the default API key
; still active; certs.h refuses to compile with its placeholder CA cert
; still in place. This is "the production firmware" RE-5's CI job builds
; and uploads, named per Docs/RELEASE_VERSIONING.md's artifact table
; (covio-firmware-vX.Y.Z.bin).
[env:release]
build_flags = -DRELEASE_BUILD=1

; ---- Factory-test build (DM-Phase 6 / ADR-008) -----------------------------
; FACTORY_TEST_BUILD=1 (config.h): compiles in the factory-only
; POST /api/v1/factory/provision local-API route. Per ADR-008's own frozen
; requirement ("the factory-test image must never be the image that ships
; to a customer") and Docs/RELEASE_VERSIONING.md's own artifact table, this
; environment is DEFINED here (RE-5's own "prepare, do not yet implement"
; scope) but is NOT built or uploaded by any CI job yet -- no routine
; compile verification, no artifact, nothing published. A future phase can
; add that without any further platformio.ini change, since the
; environment already exists and inherits the same pinned toolchain as the
; other two.
[env:factory]
build_flags = -DFACTORY_TEST_BUILD=1
