; Bench pulse generator for the Machine Station bench (not station firmware).
; Its own project on purpose: nothing here is built into, or changes, any
; station or meter image. Flash onto a plain ESP32 DevKit:
;   cd tools/bench-pulse-gen && pio run -t upload && pio device monitor -b 115200
[env:devkit]
platform = https://github.com/platformio/platform-espressif32.git#v6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
