# pyproject.toml -- RE-3 (Release Engineering, Code Quality Gates).
# Covers server/server.py and test/native/*.py. ruff is used for both
# linting and formatting (one fast tool instead of separately configuring
# flake8 + black + isort) -- see Docs/CODE_QUALITY.md for the reasoning.
#
# STATUS: this config is now actually enforced and the tree actually
# complies. It spent its first months unexecuted -- written, but with no
# Python interpreter available in any development environment (VERSIONS.md)
# -- and when CI finally ran it, it reported 70 violations. Because the
# Code Quality job is BLOCKING, that failure skipped Package Desktop App and
# Publish GitHub Release on every tag, which is why no release was ever
# published by CI and the v1.0.1/v1.0.2 assets had to be attached by hand.
#
# The tree was brought into compliance by running `ruff check --fix` and
# `ruff format` (the formatter this file configures but that had never been
# run against an existing file), plus a handful of manual fixes for long SQL
# and HTML string literals the formatter cannot split. ruff is now pinned
# exactly in requirements-dev.txt so an upstream release cannot re-break the
# gate on its own.

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = ["__pycache__", ".venv", "venv"]

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes (real-bug-catching: unused imports,
# undefined names, etc.), I = import sorting.
select = ["E", "F", "W", "I"]
# server.py's existing style already uses some intentionally dense,
# comma-packed one-liners (e.g. multi-import lines, inline SQL parameter
# tuples) that are a deliberate, reviewed convention, not an oversight --
# not blanket-ignored here, but noted so a future contributor understands
# why a line-length or style warning on one of those lines may be an
# accepted exception rather than something to "fix" reflexively. See
# Docs/CODE_QUALITY.md's Exceptions section.
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
